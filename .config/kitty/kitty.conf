# vim:ft=kitty
# Basic kitty config

# brew install --cask font-jetbrains-mono
# brew install --cask font-symbols-only-nerd-font


# Theme
#include current-theme.conf

custom_shaders dim-inactive-windows

# Font
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        17.0
disable_ligatures never

# Window
remember_window_size  yes
initial_window_width  120c
initial_window_height 36c
window_padding_width  0
hide_window_decorations titlebar-only

# Transparency / blur
background_opacity 0.88
background_blur 20
# macos_titlebar_color background

# Cursor
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# Bell / notifications
enable_audio_bell no
visual_bell_duration 0.0

# Clipboard / URLs
copy_on_select clipboard
detect_urls yes
open_url_with default

# Tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal

# Shell integration
shell_integration enabled

# macOS
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in all
macos_fullscreen_ignore_safe_area_insets yes

# Key mappings
map cmd+enter new_window_with_cwd
map cmd+]     next_tab
map cmd+[     previous_tab
# 新建分屏，继承工作目录
map cmd+enter new_window_with_cwd
# 关闭当前分屏
map cmd+w close_window
# 类似 Vim 的方向键导航
map cmd+h neighboring_window left
map cmd+j neighboring_window bottom
map cmd+k neighboring_window top
map cmd+l neighboring_window right
# 将当前窗口移动到主窗口位置
map cmd+m move_window_to_top
# 切换布局
map cmd+shift+f toggle_layout stack
